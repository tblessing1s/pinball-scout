<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Pinball Machine Placeholder</title>
  <desc id="desc">A neutral placeholder image for machines without photos.</desc>
  <rect width="640" height="420" fill="#e4e1d8"/>
  <rect x="28" y="28" width="584" height="364" rx="18" fill="#f4f2ec" stroke="#c7c1b2" stroke-width="3"/>
  <rect x="90" y="80" width="460" height="200" rx="12" fill="#eae7df" stroke="#c7c1b2" stroke-width="2"/>
  <rect x="140" y="120" width="360" height="120" rx="10" fill="#d8d2c4"/>
  <rect x="120" y="300" width="400" height="40" rx="10" fill="#d8d2c4"/>
  <text x="320" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#7d7668">
    Machine image coming soon
  </text>
  <text x="320" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#8f8879">
    Pinball Scout
  </text>
</svg>
